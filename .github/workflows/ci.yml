name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Calidad (formato, lint, tipos, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Guardia de datos personales
        run: |
          if git ls-files | grep -Ei '\.(csv|sqlite)$'; then echo "No se versionan CSV ni bases de datos"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7
# El despliegue NO está automatizado a propósito: se agrega un job `deploy` cuando exista un destino definido.
